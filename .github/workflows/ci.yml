name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: samepage
          POSTGRES_PASSWORD: samepage
          POSTGRES_DB: samepage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samepage -d samepage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://samepage:samepage@127.0.0.1:5432/samepage_test
      AUTH_SECRET: ci-only-session-secret-not-used-in-production
      OTP_DEV_MODE: "true"
      DEMO_MODE: "true"
      SEED_DEMO_DATA: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
